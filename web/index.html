<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HoneyThumb</title>
<meta name="theme-color" content="#131312">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="thumb.css">
</head>
<body>

<!-- ───────── Startanzeige: steht, bis Übersicht oder Editor erscheinen. Kommt das Programm nicht in Gang, nennt sie nach wenigen Sekunden den Grund.
     Absichtlich in altem JavaScript ohne die übrigen Dateien – sie muss auch dann laufen, wenn diese nicht laden oder das Fenster sie nicht versteht. ───────── -->
<div id="boot" style="position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#131312;color:#A9A397;font:15px/1.5 system-ui,Segoe UI,sans-serif;z-index:5"><div id="bootBox" style="max-width:640px">HoneyThumb startet …</div></div>
<script>
(function(){
  var errs = [], t0 = new Date().getTime(); window.__htBoot = {errs: errs};
  function up(){ var h = document.getElementById('home'), e = document.getElementById('ed'); return (h && h.className.indexOf('hidden') < 0) || (e && e.className.indexOf('hidden') < 0); }
  function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function facts(){ return ['Fenster: ' + navigator.userAgent, 'Dateien geladen: Piktogramme ' + (window.HoneyThumbIcons ? 'ja' : 'nein') + ', Rechenkern ' + (window.HoneyThumb ? 'ja' : 'nein') + ', Freistellen ' + (window.HoneyThumbCut ? 'ja' : 'nein') + ', Editor ' + (window.HT ? 'ja' : 'nein'), 'Windows-Programm: ' + (/[?&]desktop=1/.test(location.search) ? 'ja' + (/[?&]k=/.test(location.search) ? ', mit Speicher-Schlüssel' : ', ohne Speicher-Schlüssel') : 'nein'), 'Nach ' + Math.round((new Date().getTime() - t0) / 1000) + ' s'].concat(errs.length ? errs : ['Keine Fehlermeldung der Seite']); }
  function show(why){ var b = document.getElementById('boot'), x = document.getElementById('bootBox'); if (!b || !x || up()) return; var f = facts(), h = '<div style="color:#EDE7DA;font-size:19px;font-weight:600;margin-bottom:8px">HoneyThumb kommt nicht in Gang</div><div style="margin-bottom:12px">' + esc(why) + '</div>';
    for (var i = 0; i < f.length; i++) h += '<div style="font-size:13px;margin:3px 0;word-break:break-word">' + esc(f[i]) + '</div>';
    x.innerHTML = h + '<div style="margin-top:14px"><button onclick="location.reload()" style="background:#E5402A;color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer">Neu laden</button></div>'; window.__htBoot.shown = true;
    try { var k = (location.search.match(/[?&]k=([\w-]+)/) || [])[1]; if (k && window.XMLHttpRequest){ var r = new XMLHttpRequest(); r.open('POST', '/__store/set?key=log:start'); r.setRequestHeader('X-HoneyThumb', k); r.send(JSON.stringify({why: why, facts: f, at: new Date().toISOString()})); } } catch (e) {}
  }
  window.addEventListener && window.addEventListener('error', function(ev){ var t = ev.target || {}; errs.push(t.tagName === 'SCRIPT' || t.tagName === 'LINK' ? 'Datei lädt nicht: ' + String(t.src || t.href).split('/').pop() : 'Fehler: ' + (ev.message || '?') + (ev.filename ? ' (' + String(ev.filename).split('/').pop().split('?')[0] + ':' + ev.lineno + ')' : '')); if (errs.length > 8) errs.length = 8; }, true);
  window.addEventListener && window.addEventListener('unhandledrejection', function(ev){ var r = ev.reason; errs.push('Abgebrochen: ' + (r && r.message ? r.message : r)); if (errs.length > 8) errs.length = 8; });
  if (/Trident|MSIE/.test(navigator.userAgent) || !window.Promise || !window.addEventListener) return void setTimeout(function(){ show('Dieses Fenster nutzt die alte Windows-Darstellung (Internet Explorer). HoneyThumb braucht „Microsoft Edge WebView2“ – bitte die WebView2-Laufzeit von Microsoft installieren oder reparieren und HoneyThumb neu starten.'); }, 300);
  setTimeout(function(){ show(errs.length ? 'Beim Start ist ein Fehler aufgetreten. Bitte schick Claude ein Bildschirmfoto dieser Anzeige.' : 'Der Start dauert ungewöhnlich lange. Bitte schick Claude ein Bildschirmfoto dieser Anzeige.'); }, 7000);
  var iv = setInterval(function(){ if (up()){ clearInterval(iv); var b = document.getElementById('boot'); if (b) b.style.display = 'none'; } }, 150);
})();
</script>

<!-- ───────── Übersicht ───────── -->
<section id="home" class="screen hidden">
  <header class="bar">
    <div class="brand"><img src="icon.svg" alt="">HoneyThumb</div>
    <span class="grow"></span>
    <button class="btn ghost" id="homeLib" title="Fest hinterlegte Bilder je Marke: Personen, Auflagen, Grafiken, Hintergründe">▤<span class="d-only"> Markenunterlagen</span></button>
    <button class="btn ghost" id="homeImport" title="Bild, .honeythumb-Datei oder Markenunterlagen öffnen">⤓<span class="d-only"> Öffnen</span></button>
    <button class="btn primary" id="homeNew">＋ Neu<span class="d-only">es Titelbild</span></button>
  </header>
  <div class="home-body">
    <div id="thumbList" class="thumb-grid"></div>
    <div id="homeEmpty" class="empty hidden">
      <h2>Noch keine Titelbilder</h2>
      <p>Wähle eine Vorlage, setze ein Bild von dir ein und schreibe den Titel dazu. HoneyThumb stellt die Person frei und tauscht den Hintergrund.</p>
      <button class="btn primary" id="emptyNew">＋ Erstes Titelbild</button>
    </div>
  </div>
</section>

<!-- ───────── Editor ───────── -->
<section id="ed" class="screen hidden">
  <header class="bar ed-bar">
    <button class="icon-btn" id="edBack" title="Zur Übersicht" aria-label="Zur Übersicht">‹</button>
    <input id="edName" class="name-in" spellcheck="false" aria-label="Name des Titelbilds">
    <label class="sel-lbl d-only" title="Format des Titelbilds"><span>Format</span><select id="edFmt"></select></label>
    <button class="icon-btn acc-btn" id="edAcc" title="Akzentfarbe" aria-label="Akzentfarbe"><i></i></button>
    <span class="grow"></span>
    <span class="saved d-only" id="saved"></span>
    <button class="icon-btn" id="undoBtn" title="Rückgängig (Strg+Z)" aria-label="Rückgängig">↶</button>
    <button class="icon-btn" id="redoBtn" title="Wiederholen (Strg+Umschalt+Z)" aria-label="Wiederholen">↷</button>
    <button class="icon-btn c-only" id="edMore" title="Format und Datei" aria-label="Mehr">⋯</button>
    <button class="btn primary" id="edExport" title="Als Bild speichern">⤒<span class="d-only"> Exportieren</span></button>
  </header>

  <div class="ed-body">
    <aside class="pane left-pane" id="paneL">
      <div class="tabs" id="leftTabs"><button data-t="tpl" class="on">Vorlagen</button><button data-t="layers">Ebenen</button></div>
      <div id="tplGrid" class="pane-body tpl-grid"></div>
      <div id="layerList" class="pane-body hidden"></div>
    </aside>

    <main class="stage-pane" id="paneStage">
      <div class="stage-wrap" id="stageWrap">
        <div class="stage-box" id="stageBox">
          <canvas id="stage"></canvas>
          <div class="guide v hidden" id="guideV"></div><div class="guide h hidden" id="guideH"></div>
          <div class="sel hidden" id="sel">
            <i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i><i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i><i data-h="rot" title="Drehen"></i>
          </div>
        </div>
      </div>
      <div class="add-bar" id="addBar">
        <button class="btn" data-add="person" title="Bild wählen – HoneyThumb stellt die Person frei">＋ Person freistellen</button>
        <button class="btn" data-add="lib" title="Hinterlegte Personen, Auflagen, Grafiken und Hintergründe einsetzen">▤ Markenunterlagen</button>
        <button class="btn" data-add="text">＋ Text</button>
        <button class="btn" data-add="bar" title="Text auf Pinselstrich, schwarzem Balken oder Papier">＋ Balken</button>
        <button class="btn" data-add="img" title="Bild, Screenshot oder Logo">＋ Bild</button>
        <button class="btn" data-add="shape">＋ Form</button>
        <button class="btn" data-add="icon">＋ Symbol</button>
      </div>
      <p class="muted small warn hidden" id="warn"></p>
    </main>

    <aside class="pane insp-pane" id="paneInsp">
      <div class="pane-head"><b id="inspTitle">Hintergrund</b></div>
      <div id="insp" class="pane-body insp"></div>
    </aside>
  </div>

  <nav class="mob-tabs" id="mobTabs">
    <button data-t="tpl">Vorlagen</button>
    <button data-t="insp" class="on">Bearbeiten</button>
    <button data-t="layers">Ebenen</button>
  </nav>
</section>

<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="busy" class="busy hidden"><div><span class="spin"></span><span id="busyMsg"></span></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" class="hidden" accept=".honeythumb,.json,image/*">
<input type="file" id="imgIn" class="hidden" accept="image/*">
<input type="file" id="fontIn" class="hidden" accept=".ttf,.otf,.woff,.woff2,font/*">

<script src="thumb-icons.js"></script>
<script src="thumb-engine.js"></script>
<script src="thumb-cut.js"></script>
<script src="thumb-app.js"></script>
</body>
</html>
